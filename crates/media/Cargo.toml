[package]
name = "chattercrab-media"
description = "Client-side media engine for Chattercrab: audio, screen share and WebRTC peer management."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
chattercrab-protocol.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
crossbeam-queue = "0.3.14"
nnnoiseless = { version = "0.5.2", default-features = false }

# WebRTC (sans-IO core + async layer). `rtc` is needed to name core types such as
# `Sample`, `MediaStreamTrack` and the H.264 depacketizer.
webrtc = "0.21.1"
rtc = { version = "0.21.1", default-features = false }
async-trait = "0.1.92"
bytes = "1.12.1"
rand = "0.10.3"

# Audio
cpal = "0.18.2"
opus = "0.4.0"
ringbuf = "0.6.0"
rubato = { version = "5.0.1", default-features = false }
# dbus/rtkit support is disabled to avoid a libdbus build dependency on Linux; see ADR-205.
audio_thread_priority = { version = "0.38.0", default-features = false }

# Screen share
xcap = "0.9.8"
fast_image_resize = "6.1.0"
openh264 = "0.9.9"

[target.'cfg(target_os = "linux")'.dependencies]
# VA-API is resolved at runtime (libva.so.2, libva-drm.so.2) so the Linux
# build keeps working on hosts that do not have libva-dev installed.
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
# `windows::core::implement` emits `::windows_core::...` paths, so the crate must be
# a direct dependency for the system-audio completion handler.
windows-core = "0.62.2"
# Hardware H.264 via the GPU's Media Foundation encoder (NVENC, Quick Sync, or AMF).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
# Two-process end-to-end harness (examples/signal_call.rs, tests/two_process.rs).
chattercrab-server = { path = "../server" }
anyhow.workspace = true
serde_json.workspace = true
futures-util.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[lints]
workspace = true
