[package]
name = "chattercrab-server"
description = "Chattercrab signaling server: rooms, SDP/ICE relay, chat, and screen-share arbitration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "chattercrab_server"
path = "src/lib.rs"

[[bin]]
name = "chattercrab-signal"
path = "src/main.rs"

[dependencies]
chattercrab-protocol.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit"] }
dashmap = "6.2.1"
governor = { version = "0.10.4", default-features = false, features = ["std", "dashmap", "quanta"] }
rand = "0.10.3"
base64 = "0.23"

[dev-dependencies]
tokio-tungstenite = "0.30.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }

[lints]
workspace = true
