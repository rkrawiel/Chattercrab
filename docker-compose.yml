# Chattercrab signaling server behind Traefik.
# From the repo root, after copying .env.example to .env:
#   docker compose up -d --build
# A dollar sign inside CHATTERCRAB_PASSWORD must be written as $$ in .env
# because Compose interpolates it.

services:
  traefik:
    image: traefik:v3.7.17
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirect HTTP to HTTPS on the web entrypoint, and keep the HTTP-01
      # challenge answering on port 80. Traefik's internal ACME router uses
      # priority MaxInt and matches /.well-known/acme-challenge/ before this
      # redirect (default priority MaxInt-1). Do not set
      # entrypoints.web.allowACMEByPass and do not raise the redirect
      # priority, or the redirect swallows the challenge.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --api.dashboard=false
      - --api.insecure=false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - chattercrab

  chattercrab:
    build:
      context: .
    image: chattercrab-signal:local
    restart: unless-stopped
    environment:
      CHATTERCRAB_BIND: 0.0.0.0:8080
      CHATTERCRAB_STUN_URL: ${CHATTERCRAB_STUN_URL:-stun:stun.l.google.com:19302}
      CHATTERCRAB_AUTH_USER: ${CHATTERCRAB_AUTH_USER:-chattercrab}
      CHATTERCRAB_PASSWORD: ${CHATTERCRAB_PASSWORD:?set CHATTERCRAB_PASSWORD}
      CHATTERCRAB_MAX_ROOM_SIZE: ${CHATTERCRAB_MAX_ROOM_SIZE:-5}
      CHATTERCRAB_MAX_ROOMS: ${CHATTERCRAB_MAX_ROOMS:-100}
      CHATTERCRAB_ROOM_IDLE_TTL_SECS: ${CHATTERCRAB_ROOM_IDLE_TTL_SECS:-3600}
      RUST_LOG: ${RUST_LOG:-info,chattercrab_server=info}
    labels:
      - traefik.enable=true
      - traefik.http.routers.chattercrab.rule=Host(`${CHATTERCRAB_DOMAIN:?set CHATTERCRAB_DOMAIN}`)
      - traefik.http.routers.chattercrab.entrypoints=websecure
      - traefik.http.routers.chattercrab.tls=true
      - traefik.http.routers.chattercrab.tls.certresolver=letsencrypt
      - traefik.http.services.chattercrab.loadbalancer.server.port=8080
    networks:
      - chattercrab

networks:
  chattercrab:
    driver: bridge

volumes:
  traefik-certs:
